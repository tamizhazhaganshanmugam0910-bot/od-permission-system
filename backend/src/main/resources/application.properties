server.port=8080

# Database Configuration (In-Memory H2 MySQL Mode for instant standalone launch)
spring.datasource.url=jdbc:h2:mem:odsystem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway: Disabled in H2 dev mode, enabled in mysql profile
spring.flyway.enabled=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
